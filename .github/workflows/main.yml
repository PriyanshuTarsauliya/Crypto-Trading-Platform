name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - main-v2
  pull_request:
    branches:
      - main
      - main-v2
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Backend Build & Test (Spring Boot 3 + Java 17 + MySQL)
  # ------------------------------------------------------------------
  backend:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: treading
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x Backend/mvnw

      - name: Build & Test Backend with Maven
        working-directory: Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/treading?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: password
        run: ./mvnw -B clean package

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-jar
          path: Backend/target/*.jar
          retention-days: 7

  # ------------------------------------------------------------------
  # Frontend Build & Lint (React 18 + Vite)
  # ------------------------------------------------------------------
  frontend:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Application
        working-directory: Frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 7
