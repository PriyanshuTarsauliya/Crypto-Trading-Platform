spring.application.name=treading-plateform

server.port=5454

# H2 In-Memory Database (MySQL Mode)
spring.datasource.url=jdbc:h2:mem:treading;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment when MySQL credentials are ready)
# spring.datasource.url=jdbc:mysql://localhost:3306/treading
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= email
spring.mail.password= password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#stripe payment gatway
stripe.api.key=your key

#razorpay payment gaytway
razorpay.api.key= razorpay key
razorpay.api.secret=razorpay secret

# coingecko api key
coingecko.api.key= coin gecko api key

# gemini api key
gemini.api.key= gemini api key

#google oauth2 (optional)
spring.security.oauth2.client.registration.google.client-id= id
spring.security.oauth2.client.registration.google.client-secret= secret

