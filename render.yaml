services:
  # ------------------------------------------------------------------
  # Backend: Spring Boot 3 Web Service (Docker)
  # ------------------------------------------------------------------
  - type: web
    name: crypto-trading-backend
    runtime: docker
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5454
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:treading;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: STRIPE_API_KEY
        sync: false
      - key: RAZORPAY_API_KEY
        sync: false
      - key: RAZORPAY_API_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ------------------------------------------------------------------
  # Frontend: React 18 + Vite Static Site (Global CDN)
  # ------------------------------------------------------------------
  - type: web
    name: crypto-trading-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: crypto-trading-backend
          property: host
